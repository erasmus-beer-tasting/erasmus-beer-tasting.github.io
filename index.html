<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c140f">
<meta name="color-scheme" content="only light">
<title>Erasmus-Bierverkostung</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/oswald.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/sourcesans.woff2" as="font" type="font/woff2" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bierverkostung">
<style>
@font-face{font-family:Oswald;src:url(fonts/oswald.woff2) format('woff2');font-weight:200 700;font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Oswald;src:url(fonts/oswald-ext.woff2) format('woff2');font-weight:200 700;font-display:swap;
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Source Sans 3";src:url(fonts/sourcesans.woff2) format('woff2');font-weight:200 900;font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Source Sans 3";src:url(fonts/sourcesans-ext.woff2) format('woff2');font-weight:200 900;font-display:swap;
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Source Sans 3";src:url(fonts/sourcesans-italic.woff2) format('woff2');font-weight:200 900;font-style:italic;font-display:swap}

:root{
  color-scheme:only light;
  --bg:#efe7da;--paper:#f8f3ea;--ink:#241a14;--ink2:#3a2b22;--muted:#7d6b5d;--line:rgba(36,26,20,.16);
  --copper:#b5652b;--copperd:#8f4c1d;--gold:#ad7a1c;--red:#9e1b10;--green:#2f5e2a;--cream:#f6efe2;--sand:#c9b8a0;
  --dark:#1c140f;
  --disp:Oswald,"Arial Narrow",sans-serif;--body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:17px/1.5 var(--body);overflow-x:hidden}
body.locked{overflow:hidden}
main{max-width:640px;margin:0 auto;padding:6px 18px calc(100px + env(safe-area-inset-bottom))}
h1,h2,h3,h4{font-family:var(--disp);font-weight:500;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.03em}
p{margin:.4em 0}
button,input,select,textarea{font:inherit;color:inherit}
.hint{color:var(--muted);font-size:.9rem}
.center{text-align:center;justify-content:center}

/* Dunkles Holz mit warmem Licht, wie an der Bar */
.hero,body.dark,.sh-head,.stage,.reveal,.savebar,.tabs{
  background-color:var(--dark);
  background-image:radial-gradient(ellipse 70% 60% at 50% -10%,rgba(255,176,88,.26),transparent 70%),
    repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px 58px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 11px),
    linear-gradient(#2a1d15,#17110d);
  color:var(--cream)}

/* Überschriften im Stil der Brauerei-Seiten */
.spaced{font-weight:400;letter-spacing:.16em;line-height:1.25}
.kicker{display:flex;align-items:center;justify-content:center;gap:12px;font:500 .8rem var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--copper);margin:0 0 6px}
.kicker::before,.kicker::after{content:"";flex:0 1 46px;height:1px;background:currentColor;opacity:.7}
.kicker.light{color:#d08a4a}
.shead{text-align:center;margin:28px 0 14px}
.shead h2{font-size:2.3rem;font-weight:600;letter-spacing:.04em}
h3.rule{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:1.15rem;font-weight:400;letter-spacing:.14em;
  border-bottom:1.5px solid var(--ink);padding-bottom:7px;margin:30px 0 12px}
h3.rule small{font:400 .78rem var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  border-radius:4px;padding:11px 18px;font:500 .95rem var(--disp);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:8px 13px;font-size:.82rem}
.btn.big{padding:15px 18px;font-size:1.05rem;width:100%}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;text-decoration:underline;padding-left:0}
.btn.light{color:var(--cream);border-color:rgba(246,239,226,.6)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.actions.col{flex-direction:column;align-items:stretch}
.actions.col .btn{justify-content:flex-start;text-align:left}

/* Formulare */
.form label{display:block;font:500 .8rem var(--disp);letter-spacing:.12em;text-transform:uppercase;margin:14px 0 0;color:var(--ink2)}
.form input:not([type=file]):not([type=checkbox]):not([type=range]),.form select,textarea,.paste input{display:block;width:100%;margin-top:6px;padding:12px;
  border:1.5px solid var(--line);border-radius:4px;background:#fff;font:400 16px var(--body);letter-spacing:0;text-transform:none;color:var(--ink)}
.form input:focus,.form select:focus,textarea:focus,.paste input:focus{outline:none;border-color:var(--copper)}
.form .row{display:flex;gap:10px}.form .row label{flex:1}.form .row .abv{flex:0 0 110px}
.form .btn.big{margin-top:20px}
.form .btn.danger{margin-top:14px}
.panel.form>.btn.small{margin-top:16px}
textarea{resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%)!important;
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%!important;background-size:6px 6px!important;background-repeat:no-repeat!important;padding-right:30px!important}

/* Siegel */
.seal{display:block}
.seal .s1{fill:none;stroke:#b5652b;stroke-width:2.5}
.seal .s2{fill:none;stroke:#b5652b;stroke-width:1}
.seal .st{font:500 19px var(--disp);letter-spacing:6px;fill:#e9dcc6}
.seal .st.sm{font-size:15px;letter-spacing:3.5px}
.seal .dot{fill:#b5652b}
.seal .gl{fill:none;stroke:#e9dcc6;stroke-width:2.2;stroke-linejoin:round}
.seal .sy{font:500 15px var(--disp);letter-spacing:4px;fill:#d08a4a}

/* Start */
body.dark{min-height:100vh}
.welcome{text-align:center;padding-top:max(40px,env(safe-area-inset-top));max-width:460px}
.welcome .seal{width:150px;height:150px;margin:0 auto 26px}
.welcome h1{font-size:1.9rem;margin:6px 0 30px}
.welcome .join label{color:var(--sand);text-align:left}
.welcome .join input{border-color:transparent!important}
.note{background:rgba(255,255,255,.08);border-left:3px solid var(--copper);padding:8px 12px;text-align:left;font-size:.95rem}

/* Kopf der Bierliste */
.hero{padding:max(24px,env(safe-area-inset-top)) 18px 22px;text-align:center}
.hero-in{max-width:600px;margin:0 auto}
.hero .seal{width:96px;height:96px;margin:0 auto 16px}
.hero h1{font-size:1.65rem;margin:4px 0 20px}
.board{margin:0 auto;max-width:420px}
.glasses{display:flex;justify-content:center;align-items:flex-end;gap:6px;flex-wrap:wrap;padding:0 14px}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px}
.slot .g{width:var(--gw);height:calc(var(--gw) * 1.3);color:#d9c9ae;display:block}
.slot.on .g{color:#f6efe2}
.slot i{font:500 .7rem var(--disp);font-style:normal;color:#9c8a76;order:2;margin-top:6px}
.slot .g{order:1}
.plank{height:12px;margin-top:-18px;border-radius:6px;background:linear-gradient(#a36f3c,#74491f);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 8px 14px rgba(0,0,0,.45)}
.board-cap{font:400 .8rem var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--sand);margin:22px 0 0}

/* Laufband mit Trinksprüchen */
.marquee{overflow:hidden;background:var(--ink);border-top:1px solid #3a2b22;white-space:nowrap;font:400 1.05rem var(--disp);letter-spacing:.16em;text-transform:uppercase;padding:9px 0}
.marquee>div{display:inline-block;animation:run 34s linear infinite}
.marquee span{padding:0 14px}
.marquee i{font-style:normal;color:#5d4a3d}
.marquee .c0{color:#d08a4a}.marquee .c1{color:#e2b552}.marquee .c2{color:#efe3cc}.marquee .c3{color:#dc6a52}.marquee .c4{color:#9cbd84}
@keyframes run{to{transform:translateX(-50%)}}

/* Bierliste */
.beers{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.beer{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 14px 10px 10px;cursor:pointer}
.beer:active{background:#fff}
.swatch{position:relative;flex:0 0 62px;height:72px;border-radius:2px;display:grid;place-items:center;overflow:hidden;font:600 1.5rem var(--disp)}
.swatch.none{background:repeating-linear-gradient(135deg,#ddd1bf 0 6px,#e6dccd 6px 12px);color:var(--muted)}
.swatch.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.swatch.photo span{position:absolute;left:0;bottom:0;background:var(--ink);color:var(--cream);font-size:.8rem;padding:1px 6px}
.info{flex:1;min-width:0}
.info b{display:block;font:500 1.12rem/1.2 var(--disp);text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere;margin:4px 0 2px}
.info small{display:block;color:var(--muted);font-size:.86rem;line-height:1.35}
.tag{display:inline-block;background:var(--copper);color:var(--cream);font:500 .66rem var(--disp);letter-spacing:.14em;text-transform:uppercase;
  padding:2px 14px 2px 7px;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{text-align:right;flex:0 0 auto}
.sc strong{display:block;font:600 2rem/1 var(--disp)}
.sc span{font:400 .66rem var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sc .go{display:inline-block;border:1.5px solid var(--ink);color:var(--ink);padding:6px 10px;border-radius:3px;font-size:.72rem}
.empty{text-align:center;color:var(--muted);max-width:420px;margin:12px auto}

/* Overlays */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;opacity:0;transition:opacity .2s}
#sheet.open{opacity:1}
.sh{max-width:640px;min-height:100%;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .25s}
#sheet.open .sh{transform:none}
.pad{padding:0 18px}
.sh-head{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 18px 14px}
.sh-head .kicker{justify-content:flex-start;color:#d08a4a;margin-bottom:4px}
.sh-head .kicker::before{display:none}
.sh-head h2{font-size:1.6rem;letter-spacing:.06em;font-weight:500}
.meta{color:var(--sand);font-size:.92rem;margin:6px 0 0}
.x{flex:0 0 40px;height:40px;border-radius:50%;border:1px solid rgba(246,239,226,.45);background:none;cursor:pointer;display:grid;place-items:center;color:var(--cream)}
.x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}

/* Bewertung */
.stage{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 26px 18px;border-top:1px solid #3a2b22}
.stage-l strong{display:block;font:500 4.2rem/1 var(--disp);color:var(--cream)}
.stage-l strong small{font-size:2rem;margin-left:4px}
.stage-l span{display:block;font:400 1rem var(--disp);letter-spacing:.16em;text-transform:uppercase;color:#d08a4a;margin-top:8px}
.bigglass{width:110px;height:156px;flex:0 0 auto}
.bub{fill:#fff;opacity:0;animation:rise 3.4s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.6}100%{transform:translateY(-100px);opacity:0}}
.blk{margin:6px 0 4px}
.blk h3.rule{margin-top:26px}
h4{font-size:1rem;letter-spacing:.08em}
h4.mt{margin:20px 0 10px}
.srm{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw{aspect-ratio:1.15;border-radius:2px;border:0;background:var(--c);cursor:pointer;position:relative;padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.sw.on::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translate(-50%,-62%) rotate(45deg);filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}
.srm-name{font-size:.9rem;color:var(--muted);margin:8px 0 6px}
.opt{display:flex;align-items:flex-start;gap:10px;margin-top:8px}
.opt>span{flex:0 0 72px;font:500 .78rem var(--disp);letter-spacing:.12em;text-transform:uppercase;padding-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:6px 11px;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.chip:disabled{opacity:1;cursor:default}
.cat{margin-top:16px}
.cat-h{display:flex;justify-content:space-between;align-items:baseline}
.cat-h em{font:600 1.3rem var(--disp);font-style:normal;color:var(--copper)}
.q{font-size:.88rem;color:var(--muted);margin:2px 0 8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg{height:48px;border:1.5px solid var(--ink);border-radius:3px;background:var(--paper);font:500 1.15rem var(--disp);cursor:pointer;transition:background .12s}
.seg.full{background:var(--copper);border-color:var(--copper);color:#fff}
.seg.half{background:linear-gradient(to top,var(--copper) 50%,var(--paper) 50%);border-color:var(--copper)}
.abvguess{display:flex;align-items:center;gap:12px}
.abvguess input{flex:1;accent-color:var(--copper)}
.abvguess output{font:600 1.4rem var(--disp);min-width:76px;text-align:right}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:640px;margin:0 auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.live-score{display:flex;align-items:center;gap:12px}
.live-score strong{font:600 2.4rem/1 var(--disp);color:#e2a15e;min-width:62px}
.live-score span{font:400 .85rem var(--disp);letter-spacing:.12em;text-transform:uppercase;line-height:1.35}
.live-score small{color:var(--sand);letter-spacing:.06em}
.savebar .btn{padding:13px 26px}

/* Foto im Formular */
.photo{display:flex;align-items:center;gap:14px;margin-top:14px}
.prev{flex:0 0 92px;height:108px;border:1px dashed var(--muted);border-radius:3px;display:grid;place-items:center;background:var(--paper);overflow:hidden}
.prev img{width:100%;height:100%;object-fit:cover}
.prev .g{width:42px;height:55px;color:var(--muted)}
.photo .col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.photo label.btn{margin:0;color:var(--ink)}

/* Rankings */
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:8px;margin:18px 0 6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;text-align:center;min-width:0}
.pod .g{width:40px;height:52px;color:var(--ink)}
.pod.p1 .g{width:50px;height:65px}
.pod b{font:500 .9rem/1.15 var(--disp);text-transform:uppercase;letter-spacing:.04em;max-width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pod small{font:600 1.1rem var(--disp);color:var(--copper)}
.pod .block{width:100%;margin-top:6px;font:500 2rem/1 var(--disp);display:grid;place-items:center;color:var(--cream)}
.pod.p1 .block{height:88px;background:var(--gold)}
.pod.p2 .block{height:62px;background:#8e8a82}
.pod.p3 .block{height:44px;background:var(--copperd)}
.rank{list-style:none;margin:18px 0 0;padding:0}
.rank li{display:grid;grid-template-columns:44px 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.rank .rk{grid-row:1/3;font:500 1.5rem var(--disp);color:var(--muted)}
.rank li:nth-child(-n+3) .rk{color:var(--copper)}
.rank .info b{margin-top:0}
.rank .bar{grid-column:2/4;height:3px;background:rgba(36,26,20,.08);margin-top:8px}
.rank .bar i{display:block;height:100%;background:var(--copper)}
.spread{display:flex;align-items:center;gap:8px;margin-top:4px}
.spread em{font-style:normal;font-size:.8rem;color:var(--muted);white-space:nowrap}
.strip{width:130px;height:16px;flex:0 0 auto}
.strip line{stroke:rgba(36,26,20,.18);stroke-width:2}
.strip circle{fill:var(--muted);stroke:var(--bg);stroke-width:2}
.strip circle.me{fill:var(--copper)}
.strip .avg{stroke:var(--ink);stroke-width:2.2}
.champs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.champ{background:var(--paper);padding:12px}
.champ small{display:block;font:500 .68rem var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--copper)}
.champ b{display:block;font:500 1rem/1.2 var(--disp);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 2px;overflow-wrap:anywhere}
.champ span{font:600 .95rem var(--disp);color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px;margin:14px 0}
.panel h3{font-size:1.05rem;letter-spacing:.12em;margin-bottom:8px}
.weights summary{font:500 .9rem var(--disp);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.weights p{font-size:.92rem;color:var(--muted)}
.wrow{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:10px;margin:8px 0;font-size:.92rem}
.wrow input{accent-color:var(--copper);width:100%}
.wrow em{font:600 .95rem var(--disp);font-style:normal;text-align:right}

/* Gruppe */
.sync p{font-size:.95rem}
.sync .live{display:flex;align-items:center;gap:8px;font:500 .9rem var(--disp);letter-spacing:.1em;text-transform:uppercase;margin:0}
.sync .live i{width:10px;height:10px;border-radius:50%;background:#bbb}
.sync .live.ok i{background:var(--green);box-shadow:0 0 0 4px rgba(47,94,42,.18)}
.sync .live.bad i{background:var(--red)}
.paste{display:block;font:500 .78rem var(--disp);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.paste span{display:flex;gap:8px;margin-top:6px}
.paste input{margin:0!important;font-size:15px!important}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.award{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 12px 12px}
.ribbon{display:inline-block;background:var(--copper);color:var(--cream);font:500 .66rem var(--disp);letter-spacing:.14em;text-transform:uppercase;
  padding:4px 16px 4px 9px;margin:0 0 10px -12px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 50%,100% 100%,0 100%)}
.award b{display:block;font:500 1.12rem/1.15 var(--disp);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.award small{display:block;font-size:.84rem;color:var(--muted);line-height:1.3;margin-top:4px}
.cup{list-style:none;padding:0;margin:0}
.cup li{display:grid;grid-template-columns:36px 1fr 80px 40px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cup .rk{font:500 1.1rem var(--disp);color:var(--muted)}
.cup li:first-child .rk{color:var(--copper)}
.cup .nm{font:500 1rem/1.2 var(--disp);text-transform:uppercase;letter-spacing:.04em}
.cup .nm small{display:block;font:400 .78rem var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
.cup .bar{height:4px;background:rgba(36,26,20,.08)}.cup .bar i{display:block;height:100%;background:var(--copper)}
.cup b{font:600 1.1rem var(--disp);text-align:right}

/* Detail: Kachel in der Farbe des Biers */
.tile{display:flex;align-items:stretch;justify-content:space-between;min-height:170px;margin:18px 0 6px;overflow:hidden;border-radius:2px}
.tile-l{padding:18px 20px;display:flex;flex-direction:column;justify-content:center}
.tile-l small{font:500 .75rem var(--disp);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.tile-l strong{font:500 4.8rem/1 var(--disp)}
.tile-l span{font:400 .95rem var(--disp);letter-spacing:.14em;text-transform:uppercase}
.tile-l em{font-style:normal;font-size:.88rem;opacity:.85;margin-top:8px}
.tile img{width:42%;object-fit:cover}
.radar{display:block;width:100%;max-width:360px;margin:6px auto 0}
.radar .ring{fill:none;stroke:rgba(36,26,20,.12);stroke-width:1}
.radar .ring.outer{stroke:rgba(36,26,20,.3)}
.radar .axis{stroke:rgba(36,26,20,.12)}
.radar text{font:500 10.5px var(--disp);letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.radar polygon.me{fill:rgba(181,101,43,.22);stroke:var(--copper);stroke-width:2;stroke-linejoin:round}
.radar polygon.grp{fill:rgba(47,94,42,.08);stroke:var(--green);stroke-width:2;stroke-dasharray:5 3;stroke-linejoin:round}
.radar circle.me{fill:var(--copper);stroke:var(--bg);stroke-width:2}
.radar circle.grp{fill:var(--green);stroke:var(--bg);stroke-width:2}
.legend{display:flex;justify-content:center;gap:18px;font:500 .78rem var(--disp);letter-spacing:.1em;text-transform:uppercase;margin-top:16px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.legend i.me{background:var(--copper)}.legend i.grp{background:var(--green)}
.breakdown{width:100%;border-collapse:collapse;margin:8px 0}
.breakdown th{text-align:left;font-weight:400;padding:7px 0;border-bottom:1px solid var(--line)}
.breakdown td{text-align:right;font:600 1.05rem var(--disp);padding:7px 0 7px 14px;border-bottom:1px solid var(--line);width:64px}
.breakdown td.g{color:var(--green)}
.breakdown .lg td{font:500 .7rem var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:0}
.mynotes{margin:12px 0}
.tagline{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:3px 9px;margin:0 6px 6px 0;font-size:.85rem}
.tagline i{width:11px;height:11px;border-radius:1px}
.quote{font-style:italic;font-size:1.08rem;margin:8px 0}
.others{list-style:none;padding:0;margin:0}
.others li{display:flex;flex-wrap:wrap;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.others li b{font:600 1.1rem var(--disp)}
.others li p{flex-basis:100%;margin:2px 0 0;font-style:italic;color:var(--muted)}

/* Auflösung im Blindmodus */
.reveal{min-height:100vh;text-align:center;padding:max(34px,env(safe-area-inset-top)) 22px 30px;position:relative}
.reveal .x{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top))}
.reveal .kicker{margin-top:30px}
.reveal img{width:200px;height:240px;object-fit:cover;margin-top:14px;animation:fade .6s}
.reveal .g{width:84px;height:110px;color:var(--cream);margin-top:14px;animation:fade .6s}
.reveal h2{font-size:2rem;margin-top:18px;animation:fade .6s .15s both}
.reveal .meta{color:var(--sand)}
.reveal .guess{color:var(--sand);font-size:.95rem}
.reveal .you strong{display:block;font:500 4rem/1 var(--disp);color:#e2a15e;margin-top:16px}
.reveal .you span{font:400 .9rem var(--disp);letter-spacing:.2em;text-transform:uppercase}
.reveal .cheers{font:400 1.1rem var(--disp);letter-spacing:.24em;text-transform:uppercase;color:#d08a4a;margin:18px 0}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}

/* QR */
.qr{background:#fff;border:1px solid var(--line);padding:12px;max-width:360px;margin:20px auto}
.qr svg{display:block;width:100%;height:auto}

/* Mehr */
.switch{display:flex;align-items:center;gap:12px;cursor:pointer}
.switch input{position:absolute;opacity:0}
.switch span{flex:0 0 50px;height:28px;border-radius:14px;background:#cfc3b1;position:relative;transition:background .2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--copper)}
.switch input:checked+span::after{transform:translateX(22px)}
.foot{text-align:center;color:var(--muted);margin-top:26px;font:400 .75rem var(--disp);letter-spacing:.16em;text-transform:uppercase}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #3a2b22}
.tabs button{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 2px;
  font:400 .68rem var(--disp);letter-spacing:.12em;text-transform:uppercase;color:#9c8a76;cursor:pointer}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:#e2a15e}

/* Hinweis */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:40;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--cream);color:var(--ink);border-left:3px solid var(--copper);padding:10px 16px;border-radius:2px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  max-width:calc(100% - 32px);width:max-content;text-align:center;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:560px){
  .awards{grid-template-columns:1fr 1fr 1fr}
  .champs{grid-template-columns:1fr 1fr 1fr}
  .hero h1{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Bitte JavaScript aktivieren, um die Seite zu nutzen.</p></noscript>
<script src="config.js"></script>
<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
